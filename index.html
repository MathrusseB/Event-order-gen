<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Order Generator — Maple Ranch</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header>
    <h1>Event Order Generator</h1>
    <nav id="toolbar" aria-label="Event file actions">
      <button type="button" id="btn-new">New</button>
      <button type="button" id="btn-load">Load</button>
      <button type="button" id="btn-save">Save</button>
      <button type="button" id="btn-sample">Load Sample</button>
      <input type="file" id="file-input" accept="application/json,.json" hidden>
    </nav>
  </header>

  <main id="app"></main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
